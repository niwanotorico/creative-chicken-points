<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#39765c"><title>ちきんポイント通帳</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"></head><body><main>
<header><b>ちきんポイント通帳</b><button id="manage" aria-expanded="false" aria-controls="admin">管理</button></header>
<p class="eyebrow">CHICKEN POINTS</p><h1>いま何ポイント？</h1>
<section class="balances" aria-label="ポイント残高"><article><img class="child-illustration" src="./assets/piyokichi_game_console.png" alt="Switchで遊ぶぴよきち" width="160" height="140"><h2>ぴよきち</h2><p><strong id="piyokichi">—</strong> pt</p></article><article><img class="child-illustration" src="./assets/piyomi_tablet.png" alt="iPadを使うぴよみ" width="160" height="140"><h2>ぴよみ</h2><p><strong id="piyomi">—</strong> pt</p></article></section>
<p id="connection" role="status">残高を読み込んでいます…</p>
<section id="admin" hidden><h2>ちきんの管理画面</h2><p id="authStatus">Googleログインが必要です。</p><button id="login">Googleでログイン</button><button id="logout" hidden>ログアウト</button>
<form id="entryForm" hidden><label>こども<select id="child"><option>ぴよきち</option><option>ぴよみ</option></select></label><label>操作<select id="type"><option value="earn">加算</option><option value="spend">消費</option></select></label><label>ポイント<input id="points" type="number" inputmode="numeric" min="1" max="1000000" step="1" required></label><div class="quick"><button type="button" data-points="10">+10</button><button type="button" data-points="50">+50</button><button type="button" data-points="100">+100</button><button type="button" data-points="500">+500</button></div><label>理由 / 使い道<input id="reason" maxlength="200" required placeholder="例：お手伝い、好きなものを買った"></label><button id="save" class="primary">記録する</button></form><p id="message" role="status"></p></section>
<section><h2>最近の履歴</h2><p id="empty" hidden>まだ記録がありません。</p><ul id="history"></ul><button id="more" hidden>もっと見る</button></section><footer>ためた分も、つかった分も。ふたりのポイント通帳。</footer></main><script type="module" src="./app.js"></script></body></html>
